<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#DD7B47"/>
      <stop offset="1" stop-color="#F3D98B"/>
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <ellipse cx="300" cy="535" rx="150" ry="18" fill="#555" opacity="0.35" filter="url(#shadow)"/>

  <!-- star background -->
  <polygon points="300,30 350,170 500,170 380,260 430,410 300,330 170,410 220,260 100,170 250,170"
           fill="url(#g)" stroke="#DD7B47" stroke-width="8"/>

  <!-- badge -->
  <polygon points="120,160 480,160 530,260 300,470 70,260"
           fill="#DD7B47" stroke="#234B9B" stroke-width="12"/>

  <!-- year editable -->
  <rect x="135" y="110" width="330" height="80" fill="#DD7B47" stroke="#555" stroke-width="2"/>
  <text x="300" y="170" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="65" font-weight="bold" fill="#111">2026</text>

  <!-- rank editable -->
  <text x="300" y="350" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="190" font-weight="900" fill="#111">4</text>

</svg>